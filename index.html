<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>化学マスター：一問一答</title>
  <style>
    /* ==========================================
       RESET & BASE STYLES
       ========================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background-color: #f0f4f8;
      color: #1f2937;
      line-height: 1.6;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ==========================================
       CONTAINER & CARDS
       ========================================== */
    .app-container {
      width: 100%;
      max-width: 480px;
      background-color: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.03);
      overflow: hidden;
    }

    .screen {
      padding: 32px 24px;
      display: none;
    }

    .screen.active {
      display: block;
      animation: fadeIn 0.3s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ==========================================
       SCREEN HEADERS (Quiz & Results)
       ========================================== */
    .screen-header {
      background-color: #2563eb;
      color: #ffffff;
      margin: -32px -24px 24px -24px;
      padding: 18px;
      text-align: center;
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: 0.5px;
    }

    /* ==========================================
       TYPOGRAPHY
       ========================================== */
    h1 {
      font-size: 1.75rem;
      text-align: center;
      color: #111827;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .sub-title {
      text-align: center;
      color: #4b5563;
      font-size: 0.95rem;
      margin-bottom: 32px;
    }

    h2 {
      font-size: 1.1rem;
      color: #374151;
      margin-bottom: 12px;
      font-weight: 700;
    }

    /* ==========================================
       FORM CONTROLS (Custom Radio & Select)
       ========================================== */
    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 10px;
      color: #374151;
      font-size: 0.9rem;
    }

    /* 難易度：ボタン型ラジオグループ */
    .difficulty-radio-group {
      display: flex;
      background-color: #f3f4f6;
      border-radius: 8px;
      padding: 4px;
      border: 1px solid #e5e7eb;
    }

    .difficulty-radio-group input[type="radio"] {
      display: none;
    }

    .difficulty-radio-group label {
      flex: 1;
      text-align: center;
      padding: 10px 0;
      margin-bottom: 0;
      cursor: pointer;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      color: #6b7280;
      transition: all 0.2s ease;
    }

    .difficulty-radio-group input[type="radio"]:checked + label {
      background-color: #2563eb;
      color: #ffffff;
      box-shadow: 0 2px 4px rgba(37, 99, 235, 0.15);
    }

    /* 単元選択セレクトボックス */
    select {
      width: 100%;
      padding: 12px 16px;
      background-color: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      color: #1f2937;
      font-size: 0.95rem;
      font-family: inherit;
      cursor: pointer;
      outline: none;
      transition: all 0.2s;
    }

    select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    /* ==========================================
       BUTTONS
       ========================================== */
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      text-align: center;
      text-decoration: none;
    }

    .btn-primary {
      background-color: #2563eb;
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: #1d4ed8;
    }

    .btn-secondary {
      background-color: #ffffff;
      color: #4b5563;
      border: 1px solid #d1d5db;
    }

    .btn-secondary:hover {
      background-color: #f9fafb;
      border-color: #9ca3af;
    }

    .btn-dark {
      background-color: #4b5563;
      color: #ffffff;
    }

    .btn-dark:hover {
      background-color: #374151;
    }

    /* 自己申告ボタンエリア */
    .action-group {
      display: grid;
      grid-template-columns: 100%;
      gap: 12px;
      margin-top: 24px;
    }

    .judge-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    .btn-correct {
      background-color: #10b981;
      color: #ffffff;
    }
    .btn-correct:hover {
      background-color: #059669;
    }

    .btn-wrong {
      background-color: #fef2f2;
      color: #ef4444;
      border: 1px solid #fca5a5;
    }
    .btn-wrong:hover {
      background-color: #fee2e2;
    }

    /* ==========================================
       QUIZ SCREEN COMPONENTS
       ========================================== */
    .progress-bar {
      font-size: 0.9rem;
      color: #6b7280;
      text-align: center;
      margin-bottom: 20px;
      font-weight: 600;
      background-color: #f3f4f6;
      padding: 6px 12px;
      border-radius: 20px;
      display: inline-block;
      position: relative;
      left: 50%;
      transform: translateX(-50%);
    }

    .question-box {
      background-color: #f8fafc;
      padding: 24px;
      border-radius: 12px;
      min-height: 100px;
      margin-bottom: 24px;
      border-left: 5px solid #2563eb;
      font-size: 1.05rem;
      font-weight: 500;
      color: #1f2937;
    }

    /* 解説エリア */
    .answer-box {
      background-color: #ffffff;
      border: 1px solid #e5e7eb;
      padding: 24px;
      border-radius: 12px;
      margin-bottom: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      display: none;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
    }

    .answer-box.reveal {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    .answer-section {
      margin-bottom: 16px;
    }

    .answer-section:last-of-type {
      margin-bottom: 0;
    }

    .answer-title {
      font-weight: 700;
      font-size: 0.85rem;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .title-correct { color: #10b981; }
    .title-comment { color: #f59e0b; }

    .answer-text {
      font-size: 1.25rem;
      font-weight: 700;
      color: #111827;
      padding-left: 12px;
    }

    .comment-text {
      font-size: 0.95rem;
      color: #4b5563;
      padding-left: 12px;
    }

    /* ==========================================
       RESULT SCREEN COMPONENTS
       ========================================== */
    .result-score {
      text-align: center;
      margin: 24px 0 32px 0;
    }

    .score-number {
      font-size: 3.5rem;
      font-weight: 800;
      color: #2563eb;
      line-height: 1;
    }

    .score-label {
      font-size: 0.95rem;
      color: #6b7280;
      margin-top: 8px;
      font-weight: 600;
    }

    .stats-table {
      width: 100%;
      margin-bottom: 32px;
      background-color: #f8fafc;
      border-radius: 12px;
      padding: 8px 16px;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid #e2e8f0;
      font-size: 0.95rem;
      color: #4b5563;
    }

    .stats-row:last-child {
      border-bottom: none;
    }

    .stats-val {
      font-weight: 700;
      color: #111827;
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- 1. スタート画面 -->
    <div id="start-screen" class="screen active">
      <h1>化学マスター：一問一答</h1>
      <div class="sub-title">基礎から発展まで、スピード学習</div>
      
      <div class="form-group">
        <label>1. 難易度を選択してください</label>
        <div class="difficulty-radio-group">
          <input type="radio" id="diff-soft" name="difficulty" value="soft">
          <label for="diff-soft">SOFT</label>
          <input type="radio" id="diff-medium" name="difficulty" value="medium" checked>
          <label for="diff-medium">MEDIUM</label>
          <input type="radio" id="diff-hard" name="difficulty" value="hard">
          <label for="diff-hard">HARD</label>
        </div>
      </div>

      <div class="form-group">
        <label for="sector-select">2. 単元を選択してください</label>
        <select id="sector-select">
          <!-- JSで動的に選択肢を自動生成 -->
        </select>
      </div>

      <button id="start-btn" class="btn btn-primary" style="margin-top: 32px;">クイズを開始</button>
    </div>

    <!-- 2. クイズ画面 -->
    <div id="quiz-screen" class="screen">
      <div class="screen-header">Quiz</div>
      <div class="progress-bar">問題: <span id="current-lap">1</span> / <span id="total-lap">0</span></div>
      
      <h2>QUESTION</h2>
      <div id="question-text" class="question-box">問題文がここに表示されます。</div>

      <!-- 答えを表示ボタン（初期状態） -->
      <div id="action-area" class="action-group">
        <button id="view-answer-btn" class="btn btn-primary">答えを表示</button>
      </div>

      <!-- 解説エリア（ボタンを押したら表示） -->
      <div id="answer-area" class="answer-box">
        <div class="answer-section">
          <div class="answer-title title-correct">■ 正解</div>
          <div id="answer-text" class="answer-text">ここに答えが表示されます。</div>
        </div>
        <div class="answer-section">
          <div class="answer-title title-comment">■ 解説</div>
          <div id="comment-text" class="comment-text">ここに解説が表示されます。</div>
        </div>
        
        <!-- 自己申告ボタン -->
        <div class="judge-group">
          <button id="correct-btn" class="btn btn-correct">正解した</button>
          <button id="wrong-btn" class="btn btn-wrong">間違えた</button>
        </div>
      </div>
      <button id="retire-btn" class="btn btn-dark" style="margin-top: 32px;">クイズを終了してトップに戻る</button>
    </div>

    <!-- 3. リザルト画面 -->
    <div id="result-screen" class="screen">
      <div class="screen-header">Results</div>
      <h1>クイズ完了</h1>
      <div class="sub-title">おつかれさまでした</div>

      <div class="result-score">
        <div id="result-rate" class="score-number">0%</div>
        <div class="score-label">正解率</div>
      </div>

      <div class="stats-table">
        <div class="stats-row">
          <span>難易度</span>
          <span id="res-diff" class="stats-val">-</span>
        </div>
        <div class="stats-row">
          <span>単元</span>
          <span id="res-sector" class="stats-val">-</span>
        </div>
        <div class="stats-row">
          <span>総問題数</span>
          <span id="res-total" class="stats-val">-</span>
        </div>
        <div class="stats-row">
          <span>正解数</span>
          <span id="res-correct" class="stats-val" style="color: #10b981;">-</span>
        </div>
      </div>

      <button id="back-to-top-btn" class="btn btn-primary">トップに戻る</button>
    </div>

  </div>

  <!-- ==========================================
       JAVASCRIPT LOGIC
       ========================================== */ -->
  <script src="quiz-data.js"></script>
  
  <script>
    /* -------------------------------------------
       1. 大単元（章）の日本語名称マップ
       ------------------------------------------- */
    const chapterNames = {
      "第1章": "第1章：物質の探究",
      "第2章": "第2章：物質の構成粒子",
      "第3章": "第3章：物質と化学結合",
      "第4章": "第4章：物質量と濃度・溶解度",
      "第5章": "第5章：化学反応式と量的関係",
      "第6章": "第6章：酸・塩基",
      "第7章": "第7章：酸化還元反応",
      "第8章": "第8章：電池・電気分解",
      "第9章": "第9章：状態変化とエネルギー",
      "第10章": "第10章：固体の構造"
    };

    /* -------------------------------------------
       2. アプリケーション状態管理 (State)
       ------------------------------------------- */
    let currentDifficulty = 'medium';
    let currentSector = '';
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;

    /* -------------------------------------------
       3. DOM要素の取得
       ------------------------------------------- */
    const startScreen = document.getElementById('start-screen');
    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');

    const sectorSelect = document.getElementById('sector-select');
    const startBtn = document.getElementById('start-btn');

    const currentLapTxt = document.getElementById('current-lap');
    const totalLapTxt = document.getElementById('total-lap');
    const questionText = document.getElementById('question-text');
    const viewAnswerBtn = document.getElementById('view-answer-btn');
    const answerArea = document.getElementById('answer-area');
    const answerText = document.getElementById('answer-text');
    const commentText = document.getElementById('comment-text');
    const correctBtn = document.getElementById('correct-btn');
    const wrongBtn = document.getElementById('wrong-btn');
    const retireBtn = document.getElementById('retire-btn');

    const resultRateTxt = document.getElementById('result-rate');
    const resDiffTxt = document.getElementById('res-diff');
    const resSectorTxt = document.getElementById('res-sector');
    const resTotalTxt = document.getElementById('res-total');
    const resCorrectTxt = document.getElementById('res-correct');
    const backToTopBtn = document.getElementById('back-to-top-btn');

    /* -------------------------------------------
       4. 選択されている難易度（ラジオボタン）の取得ヘルパー
       ------------------------------------------- */
    function getSelectedDifficulty() {
      return document.querySelector('input[name="difficulty"]:checked').value;
    }

    /* -------------------------------------------
       5. ユーティリティ関数（化学式自動下付き変換）
       ------------------------------------------- */
    function formatChemicalFormula(text) {
      if (!text) return "";
      return text.replace(/([A-Z][a-z]?)(\d+)/g, '$1<sub>$2</sub>');
    }

    /* -------------------------------------------
       6. イベントリスナー・関数定義
       ------------------------------------------- */

    function updateSectorMenu() {
      const diff = getSelectedDifficulty();
      sectorSelect.innerHTML = '';
      
      if (typeof quizQuestions === 'undefined') {
        const opt = document.createElement('option');
        opt.textContent = "データファイル未読み込み";
        sectorSelect.appendChild(opt);
        return;
      }

      const chapters = new Set();
      quizQuestions.forEach(q => {
        if (q.difficulty === diff) {
          const match = q.question.match(/【(第\d+章)】/);
          if (match) {
            chapters.add(match[1]);
          }
        }
      });

      const allOption = document.createElement('option');
      allOption.value = 'all';
      allOption.textContent = 'すべての単元から出題';
      sectorSelect.appendChild(allOption);

      Array.from(chapters).sort((a, b) => {
        const numA = parseInt(a.match(/\d+/)[0]);
        const numB = parseInt(b.match(/\d+/)[0]);
        return numA - numB;
      }).forEach(ch => {
        const option = document.createElement('option');
        option.value = ch;
        option.textContent = chapterNames[ch] || ch;
        sectorSelect.appendChild(option);
      });
    }

    // 難易度（ラジオボタン）変更時にセクターを連動
    document.querySelectorAll('input[name="difficulty"]').forEach(radio => {
      radio.addEventListener('change', updateSectorMenu);
    });
    
    window.addEventListener('DOMContentLoaded', updateSectorMenu);

    function switchScreen(targetScreen) {
      [startScreen, quizScreen, resultScreen].forEach(screen => {
        screen.classList.remove('active');
      });
      targetScreen.classList.add('active');
    }

    // クイズ開始
    startBtn.addEventListener('click', () => {
      currentDifficulty = getSelectedDifficulty();
      currentSector = sectorSelect.value;

      if (typeof quizQuestions === 'undefined') {
        alert('quiz-data.js が正しく読み込まれていません。');
        return;
      }

      let filtered = quizQuestions.filter(q => q.difficulty === currentDifficulty);
      
      if (currentSector !== 'all') {
        filtered = filtered.filter(q => q.question.includes(`【${currentSector}】`));
      }

      currentQuestions = filtered;
      
      if (currentQuestions.length === 0) {
        alert('選択された条件に該当する問題がありません。');
        return;
      }

      currentIndex = 0;
      score = 0;
      
      totalLapTxt.textContent = currentQuestions.length;
      showQuestion();
      switchScreen(quizScreen);
    });

    function showQuestion() {
      answerArea.classList.remove('reveal');
      viewAnswerBtn.style.display = 'block';

      const q = currentQuestions[currentIndex];
      currentLapTxt.textContent = currentIndex + 1;
      
      questionText.innerHTML = formatChemicalFormula(q.question);
      answerText.innerHTML = formatChemicalFormula(q.answer);
      commentText.innerHTML = formatChemicalFormula(q.comment);
    }

    viewAnswerBtn.addEventListener('click', () => {
      viewAnswerBtn.style.display = 'none';
      answerArea.classList.add('reveal');
    });

    correctBtn.addEventListener('click', () => {
      score++;
      nextStep();
    });

    wrongBtn.addEventListener('click', () => {
      nextStep();
    });

    function nextStep() {
      currentIndex++;
      if (currentIndex < currentQuestions.length) {
        showQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      const total = currentQuestions.length;
      const rate = Math.round((score / total) * 100);

      resultRateTxt.textContent = `${rate}%`;
      resDiffTxt.textContent = currentDifficulty.toUpperCase();
      
      let sectorLabel = 'すべての単元';
      if (currentSector !== 'all') {
        sectorLabel = chapterNames[currentSector] || currentSector;
      }
      resSectorTxt.textContent = sectorLabel;
      resTotalTxt.textContent = `${total} 問`;
      resCorrectTxt.textContent = `${score} 問`;

      switchScreen(resultScreen);
    }

    backToTopBtn.addEventListener('click', () => {
      updateSectorMenu();
      switchScreen(startScreen);
    });

    retireBtn.addEventListener('click', () => {
      const resetConfirm = confirm('本当にクイズを中断してトップに戻りますか？\n（これまでの学習記録は破棄されます）');
      if (resetConfirm) {
        updateSectorMenu();
        switchScreen(startScreen);
      }
    });
  </script>
</body>
</html>
